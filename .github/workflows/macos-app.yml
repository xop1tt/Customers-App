name: macOS app

# В каждом PR идут только быстрые проверки: swift test (ядро, поиск, облако, интерфейс), до 10 минут.
# Полная сборка (универсальное приложение, проверка запуска, установщик) — только после слияния в main.
# Всё, что может идти дольше 10 минут, тоже держим только для main (см. Wiki → Тестирование).
on:
  push:
    branches: [main]
    paths: ["macos/**", ".github/workflows/macos-app.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos-app.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Новый коммит в ту же ветку отменяет устаревшую сборку.
concurrency:
  group: macos-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (swift test)
    # Стандартные раннеры (включая macOS) бесплатны для публичных репозиториев.
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Xcode 26+ (SDK macOS 26): настоящий Liquid Glass в интерфейсе. См. scripts/select-xcode.sh.
      - name: Toolchain (Xcode 26)
        run: ./scripts/select-xcode.sh

      # Кэш сборки SwiftPM: повторные сборки компилируют только изменённое.
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: macos/.build
          key: spm-${{ runner.os }}-${{ env.XCODE_ID }}-${{ github.event.repository.name }}-${{ hashFiles('macos/Package.swift', 'macos/Package.resolved') }}-${{ hashFiles('macos/Sources/**', 'macos/Tests/**') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ env.XCODE_ID }}-${{ github.event.repository.name }}-${{ hashFiles('macos/Package.swift', 'macos/Package.resolved') }}-

      - name: Tests (core, search, cloud, interface)
        run: swift test --enable-code-coverage

      # Покрытие строк по модулям попадает в сводку запуска. Это справка, а не условие:
      # порог добавим, когда накопится история значений.
      - name: Coverage summary
        if: success() || failure()
        continue-on-error: true
        run: python3 scripts/swift-coverage-summary.py "$(swift test --show-codecov-path)" >> "$GITHUB_STEP_SUMMARY"

  build:
    # Только после слияния в main (и вручную): в PR полная сборка не нужна.
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain (Xcode 26)
        run: ./scripts/select-xcode.sh

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: macos/.build
          key: spm-${{ runner.os }}-${{ env.XCODE_ID }}-${{ github.event.repository.name }}-${{ hashFiles('macos/Package.swift', 'macos/Package.resolved') }}-${{ hashFiles('macos/Sources/**', 'macos/Tests/**') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ env.XCODE_ID }}-${{ github.event.repository.name }}-${{ hashFiles('macos/Package.swift', 'macos/Package.resolved') }}-

      - name: Build app
        env:
          UNIVERSAL: "1"
          # Облако: адрес проекта и ПУБЛИЧНЫЙ ключ из переменных репозитория (не секретов).
          # Не заданы — собирается версия только с локальными учётными записями.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # Облачные диски: ID OAuth-приложений — переменные репозитория, секрет клиента Google — секрет.
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
        run: ./scripts/build-app.sh build

      - name: Smoke test (launch)
        run: ./scripts/smoke-test.sh

      - name: Pack installer
        run: ./scripts/make-dmg.sh build/Customers-macOS.dmg

      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Customers-macOS
          path: macos/build/Customers-macOS.dmg
          retention-days: 14
