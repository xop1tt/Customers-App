name: Release

# Один релиз для обеих систем. Создаётся пушем тега вида v1.0.0 или вручную (Actions → Release → Run workflow):
# параллельно собираются приложение для macOS (универсальный dmg: Apple Silicon и Intel) и установщик для Windows,
# оба из одного кода desktop/ (Tauri 2: Rust + React), затем одна задача создаёт
# GitHub Release с заметками из .github/release-notes/<тег>.md и прикладывает все файлы.
# При ручном запуске тег ставится на выбранный коммит ветки; обе сборки берут этот же коммит.
# Если одна из сборок упала, релиз не создаётся.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза строго из трёх или четырёх чисел: v1.2.0 или v1.2.0.1 (v1.2 не подходит)"
        required: true
        default: "v1.2.0"

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Сборки идут без прав на запись: токен не достаётся ни сборочным скриптам, ни установщику Inno Setup, ни чужим пакетам.
  macos:
    name: Build macOS app
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then echo "Неверный тег: $TAG. Нужен вид vX.Y.Z или vX.Y.Z.W, например v1.2.0" >&2; exit 1; fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Rust targets (Apple Silicon and Intel)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Version from the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/set-version.cjs "${TAG#v}"
      - run: npm ci --no-audit --no-fund

      - name: Tests (interface)
        run: npm test

      - name: Tests (core)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Постоянная подпись своим сертификатом (секреты MACOS_SIGN_P12 и MACOS_SIGN_PASSWORD,
      # создаются скриптом scripts/make-macos-signing-certificate.sh). Без секретов — ad-hoc подпись.
      - name: Signing certificate
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "Сертификат не задан: подпись ad-hoc"; exit 0; fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/sign.p12"
          ID="$(security find-identity -p codesigning "$KC" | awk '/\)/ {print $2; exit}')"
          if [ -z "$ID" ]; then echo "::warning::В сертификате нет ключа подписи кода"; exit 0; fi
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build app
        env:
          # Облако: адрес проекта и ПУБЛИЧНЫЙ ключ из переменных репозитория (не секретов).
          # Не заданы — собирается версия только с локальными учётными записями.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # Облачные диски: ID OAuth-приложений — переменные репозитория, секрет клиента Google — секрет.
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
        run: npx tauri build --bundles app --target universal-apple-darwin

      - name: Sign, check and pack
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          APP="$PWD/src-tauri/target/universal-apple-darwin/release/bundle/macos/Customers.app"
          ID="${SIGN_IDENTITY:--}"
          codesign --force --deep --sign "$ID" ${SIGN_KEYCHAIN:+--keychain "$SIGN_KEYCHAIN"} "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -dr - "$APP" 2>&1 | sed 's/^/Требование подписи: /' || true
          lipo -archs "$APP/Contents/MacOS/customers" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/customers" | grep -q x86_64
          plutil -extract CFBundleURLTypes xml1 -o - "$APP/Contents/Info.plist" | grep -q leadgenerator
          mkdir -p "$PWD/out"
          ./scripts/make-dmg.sh "$PWD/out/Customers-${TAG}-macOS.dmg" "$APP"
          (cd out && shasum -a 256 "Customers-${TAG}-macOS.dmg" | tee "Customers-${TAG}-macOS.dmg.sha256")

      - name: Upload macOS files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: |
            desktop/out/Customers-v*-macOS.dmg
            desktop/out/Customers-v*-macOS.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Версия из тега
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+(?:\.\d+)?)$') { throw "Тег должен иметь вид vX.Y.Z или vX.Y.Z.W, получено: $env:TAG" }
          "VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          node scripts/set-version.cjs $Matches[1]

      - run: npm ci --no-audit --no-fund

      - name: Tests (interface)
        run: npm test

      - name: Tests (core)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build app
        run: npx tauri build --no-bundle
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}

      - name: Stage the installer contents
        run: |
          New-Item -ItemType Directory -Path dist-installer -Force | Out-Null
          Copy-Item src-tauri/target/release/customers.exe dist-installer/Customers.exe
          "{0:N1} МБ" -f ((Get-Item dist-installer/Customers.exe).Length / 1MB)

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc /Qp "/DAppVersion=$env:VERSION" /DSourceDir="$PWD\dist-installer" /DOutputDir="$PWD\artifacts" installer/Customers.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC завершился с кодом $LASTEXITCODE" }

      - name: Installer check
        run: ./installer/check.ps1 -Artifacts artifacts

      - name: Checksum
        run: |
          $setup = Get-ChildItem artifacts -Filter 'Customers-v*-Windows-x64-Setup.exe' | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Out-File -FilePath "$($setup.FullName).sha256" -Encoding ascii
          Get-Content "$($setup.FullName).sha256"

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            desktop/artifacts/Customers-v*-Windows-x64-Setup.exe
            desktop/artifacts/Customers-v*-Windows-x64-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-checks
          path: desktop/artifacts/install.log
          if-no-files-found: ignore
          retention-days: 14

  # Единственное место с правом записи: берёт готовые файлы обеих сборок и кладёт их в релиз. Код проекта здесь не выполняется.
  publish:
    name: Publish the release
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # только для создания релиза и загрузки файлов
      actions: read # чтобы скачать собранные файлы из этого же запуска
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Заметки лежат в репозитории; код оттуда не запускается.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release-notes

      - name: Download the files built in this run
        run: |
          gh run download "${{ github.run_id }}" --name release-macos --dir files --repo "$GITHUB_REPOSITORY"
          gh run download "${{ github.run_id }}" --name release-windows --dir files --repo "$GITHUB_REPOSITORY"
          ls -l files

      - name: Publish release
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then echo "Неверный тег: $TAG. Нужен вид vX.Y.Z или vX.Y.Z.W, например v1.2.0" >&2; exit 1; fi
          files=(files/*)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Релиз уже создан (например, через интерфейс GitHub): только прикладываем файлы.
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          # Тег создаём отдельным вызовом: если его не дадут создать, в логе будет настоящая причина,
          # а не общий отказ при создании релиза.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi
          notes=".github/release-notes/${TAG}.md"
          args=(--title "Customers ${TAG#v}" --verify-tag)
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          gh release create "$TAG" "${files[@]}" "${args[@]}" --repo "$GITHUB_REPOSITORY"
