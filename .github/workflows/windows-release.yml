name: Windows release

# Установщик для Windows прикрепляется к тому же GitHub Release, что и приложение для macOS.
# Запускается пушем тега v* (параллельно с macOS-релизом, который его создаёт; здесь ждём, пока релиз появится)
# или вручную: Actions → Windows release → Run workflow (тег уже существующего релиза).
# Файлы: Customers-vX.Y.Z-Windows-x64-Setup.exe и Customers-vX.Y.Z-Windows-x64-Setup.exe.sha256 —
# их ищет проверка обновлений в самом приложении.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег существующего релиза, например v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # только для загрузки файлов в релиз
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: windows/global.json

      - name: Версия из тега
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Тег должен иметь вид vX.Y.Z, получено: $env:TAG" }
          "VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Tests
        run: |
          dotnet test tests/Customers.Core.Tests -c Release
          dotnet test tests/Customers.Presentation.Tests -c Release

      - name: Publish (self-contained)
        run: >
          dotnet publish src/Customers.App -c Release -r win-x64 --self-contained true
          -p:Version=$env:VERSION -p:AssemblyVersion="$env:VERSION.0" -p:FileVersion="$env:VERSION.0"
          -o "${{ github.workspace }}/windows/artifacts/publish"

      - name: Smoke run
        run: ./tools/smoke.ps1 -Exe artifacts/publish/Customers.exe -Output artifacts/smoke-publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc /Qp "/DAppVersion=$env:VERSION" /DSourceDir="$PWD\artifacts\publish" /DOutputDir="$PWD\artifacts" installer/Customers.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC завершился с кодом $LASTEXITCODE" }

      - name: Installer check
        run: ./tools/installer-check.ps1 -Artifacts artifacts

      - name: Checksum
        run: |
          $setup = Get-ChildItem artifacts -Filter 'Customers-v*-Windows-x64-Setup.exe' | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Out-File -FilePath "$($setup.FullName).sha256" -Encoding ascii
          Get-Content "$($setup.FullName).sha256"

      # Релиз создаёт macOS-процесс (release.yml). Ждём его до 40 минут; при ручном запуске релиз уже существует.
      - name: Attach to the release
        run: |
          $deadline = (Get-Date).AddMinutes(40)
          while ($true) {
            gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) { break }
            if ((Get-Date) -gt $deadline) { throw "Релиз $env:TAG так и не появился" }
            Write-Host "Релиз $env:TAG ещё не создан, ждём…"
            Start-Sleep -Seconds 30
          }
          $files = Get-ChildItem artifacts -Filter 'Customers-v*-Windows-x64-Setup.exe*' | ForEach-Object { $_.FullName }
          gh release upload $env:TAG @files --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось загрузить файлы в релиз' }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-checks
          path: |
            windows/artifacts/smoke-publish
            windows/artifacts/smoke-installed
            windows/artifacts/install.log
          retention-days: 14
