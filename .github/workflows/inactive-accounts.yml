name: Inactive accounts

# Раз в неделю: предупреждает облачные аккаунты без активности более 2 лет и удаляет тех, кого предупредили
# не менее 30 дней назад и кто не нажал «Сохранить аккаунт». Вся логика — в Edge Function inactive-accounts.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inactive-accounts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Call inactive-accounts
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$CRON_SECRET" ]]; then
            echo "SUPABASE_URL (variable) or CRON_SECRET (secret) is not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 240 -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            "${SUPABASE_URL%/}/functions/v1/inactive-accounts"
          echo
