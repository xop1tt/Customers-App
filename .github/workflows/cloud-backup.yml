name: Cloud backup

# Каждый день: снимок облачной базы Customers (схемы public, private, auth — данные, учётные записи, права),
# проверка, что снимок восстанавливается на чистом PostgreSQL 17 и число строк каждой таблицы совпадает,
# шифрование (gpg, AES-256, пароль BACKUP_PASSPHRASE) и хранение в артефактах GitHub 90 дней.
# Бесплатно: Supabase Free не делает резервных копий, артефакты входят в бесплатный лимит GitHub (ADR-043).
# Восстановление вручную — docs/BACKUP.md. Workflow только читает базу.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: supabase/tests/requirements.txt
      - run: pip install -r supabase/tests/requirements.txt
      - name: Settings
        env:
          SOURCE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [[ -z "$SOURCE_DB_URL" || -z "$BACKUP_PASSPHRASE" ]]; then
            echo "::error::Секреты SUPABASE_DB_URL и BACKUP_PASSPHRASE не заданы — резервная копия не создана (docs/BACKUP.md)."
            exit 1
          fi
      # Клиент PostgreSQL 17: pg_dump должен быть не старше сервера Supabase (PostgreSQL 17).
      - name: PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Dump
        env:
          SOURCE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python supabase/cloud-backup/backup.py dump backup
      - name: Restore check
        env:
          TARGET_DB_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres
        run: python supabase/cloud-backup/backup.py check backup
      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          name="customers-db-$(date -u +%Y-%m-%d)"
          tar -C backup -cf "$name.tar" customers.dump manifest.json
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 \
            --output "$name.tar.gpg" "$name.tar" 3<<<"$BACKUP_PASSPHRASE"
          rm -rf backup "$name.tar"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - name: Store
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gpg
          retention-days: 90
          if-no-files-found: error
