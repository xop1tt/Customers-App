name: Cloud

# Серверная часть (миграции Supabase, функции писем) и облачный модуль приложения проверяются
# на одноразовом локальном стенде прямо в раннере: PostgreSQL, Supabase Auth и PostgREST в
# Docker, функции в Deno, тестовый SMTP. Никакие облачные проекты и секреты не используются.
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "desktop/src-tauri/src/cloud/**"
      - "desktop/src-tauri/tests/stack.rs"
      - "desktop/src-tauri/Cargo.*"
      - ".github/workflows/cloud.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "desktop/src-tauri/src/cloud/**"
      - "desktop/src-tauri/tests/stack.rs"
      - "desktop/src-tauri/Cargo.*"
      - ".github/workflows/cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cloud:
    runs-on: ubuntu-24.04
    # Холодная сборка Rust-клиента занимает несколько минут; с кэшем Cargo всё укладывается в 10.
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      DENO: ${{ github.workspace }}/.deno/node_modules/.bin/deno
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: supabase/tests/requirements.txt
      - run: pip install -r supabase/tests/requirements.txt
      - name: Deno
        run: npm install --prefix .deno --no-save --no-audit --no-fund deno@2.5.6 && "$DENO" --version

      - name: Functions (unit tests, type check)
        working-directory: supabase/functions
        run: |
          "$DENO" test --allow-env _shared/shared_test.ts
          "$DENO" check send-email/index.ts email-gate/index.ts delete-account/index.ts

      - name: Start local stack
        run: supabase/tests/stack/up.sh

      - name: Server tests (auth, email limits, RLS, sync)
        run: python -m pytest supabase/tests -q -p no:cacheprovider

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: cargo-cloud-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-cloud-

      - name: Rust cloud client (unit + end-to-end on the stack)
        working-directory: desktop
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
          # Макросу Tauri нужна папка с интерфейсом; для тестов облака содержимое не важно.
          mkdir -p dist && : > dist/index.html
          source ../supabase/tests/stack/env.sh
          LG_STACK_URL="$SUPABASE_URL" LG_STACK_ANON="$SUPABASE_ANON_KEY" LG_STACK_MAIL="$STACK_MAIL_DIR" \
            cargo test --manifest-path src-tauri/Cargo.toml --test stack -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --lib cloud::

      - name: Stack logs on failure
        if: failure()
        run: |
          docker logs lg-gotrue 2>&1 | tail -50 || true
          tail -50 supabase/tests/stack/.run/*.log || true
