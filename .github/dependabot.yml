version: 2
updates:
  - package-ecosystem: github-actions   # обновляет закреплённые SHA действий
    directory: /
    schedule: {interval: weekly}
    labels: [dependencies]
    groups:
      actions: {patterns: ["*"], update-types: [minor, patch]}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    labels: [dependencies]
    groups:
      python: {patterns: ["*"], update-types: [minor, patch]}
  - package-ecosystem: npm   # интерфейс приложения (desktop/)
    directory: /desktop
    schedule: {interval: weekly}
    labels: [dependencies]
    groups:
      npm: {patterns: ["*"], update-types: [minor, patch]}
  - package-ecosystem: cargo   # ядро приложения (desktop/src-tauri)
    directory: /desktop/src-tauri
    schedule: {interval: weekly}
    labels: [dependencies]
    groups:
      cargo: {patterns: ["*"], update-types: [minor, patch]}
