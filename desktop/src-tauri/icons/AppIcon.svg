<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Источник значка. PNG строится scripts/make-icon.py по той же геометрии. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F1F22"/><stop offset="1" stop-color="#09090A"/></linearGradient>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="247" x2="0" y2="777"><stop offset="0" stop-color="#5AC2FF"/><stop offset="1" stop-color="#1A7CFF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/></g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <!-- Буква C: центр по вертикали 512, рамка буквы по горизонтали тоже по центру; без наклона -->
  <path d="M 699.76 382.71 A 210 210 0 1 0 699.76 641.29" fill="none" stroke="url(#g)" stroke-width="110" stroke-linecap="round" filter="url(#lift)"/>
</svg>
