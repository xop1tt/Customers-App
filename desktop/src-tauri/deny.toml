# Проверка зависимостей Rust (пакет G8, ADR-060): `cargo deny check` в CI (desktop.yml, задача rust на Linux).
# Документ: docs/SECURITY_MODEL.md, раздел «Зависимости».

[graph]
# Приложение выпускается только для macOS и Windows: зависимости Linux (GTK, D-Bus) в установщики не попадают.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
version = 2
# Уязвимости — всегда ошибка. Заброшенные пакеты — ошибка только для прямых зависимостей:
# транзитивные исправляет обновление Tauri и плагинов (Dependabot).
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Разрешительные лицензии и MPL-2.0 (слабый копилефт на уровне файла: исходники пакетов не меняем).
# Совместимость с лицензией приложения (FSL-1.1-ALv2, ADR-041) перед коммерческим использованием проверяет юрист.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# SQLCipher: SQLite (public domain, «blessing») и libtomcrypt (WTFPL) — только для этого пакета.
[[licenses.exceptions]]
crate = "sqlcipher-src"
allow = ["blessing", "WTFPL"]

[licenses.private]
# Само приложение (publish = false) проверяется не здесь: его лицензия — LICENSE в корне.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
