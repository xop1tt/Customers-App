[package]
name = "customers"
version = "1.1.0"
description = "Customers — поиск потенциальных клиентов"
edition = "2021"
rust-version = "1.80"
publish = false
license-file = "../../LICENSE"

[lib]
name = "customers_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "customers"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-deep-link = "2.6"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-notification = "2.8"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-autostart = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
tokio-util = "0.7"
async-trait = "0.1"
encoding_rs = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "form"] }
futures-util = "0.3"
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
sha2 = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
base64 = "0.23"
hex = "0.4"
rand = "0.10"
regex = "1"
fancy-regex = "0.20"
once_cell = "1"
url = "2"
percent-encoding = "2"
quick-xml = "0.37"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
webpki-roots = "1"
uuid = { version = "1", features = ["v4"] }
plist = "1"
fs4 = { version = "0.13", features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_System_Power", "Win32_System_Registry"] }
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
